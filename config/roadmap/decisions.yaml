- decision_no: 70
  version: 1
  decided_on: '2026-10-30'
  question: 同一标的的多份计划
  decision: |-
    一只股票同一时间至多一条活跃链（入场期、持仓期或退出期）；再次触发不开新链：`plan` 节点照常算规则基线、记一行并入记录，触发作为 `retrigger` 信号进已有链当天的复查，入场期直接走修订、写明宿主差异与变化说明（价位不变时为「续期」），入场期上限从最近一次触发起算；链结束（过期、作废、平仓）后才开新链；首版提议能看到同标的最近一条已结束链的摘要（只读、受截止时间约束）；上线前已有的重复链，旧的一条判为「被取代」，不改旧行
  quote: |-
    同一只股票（例如 MU）今天和明天都出现在计划里，入场价不同，不知道这两份计划是什么关系、为什么变了
