  decision: |-
    改**账本模型 `account-1`**：权益 = 现金 + 持仓 × 最近收盘，现金 = 初始现金 + 出入金 − 买入成本 + 卖出所得；真实账户录一次初始现金与开户日开账（可带券商已有持仓，作实物转入、不扣现金）；券商月末快照保留为**对账**：每条快照与同日账本权益比，差额超 1% 或 100 美元（账户参数）标「待核对」，只提示不修正任何记录。理由：用户要跟进账户金额变化，快照一个月一个点做不到；模拟账户只能用账本，真实账户不同口径三条曲线就不可比。备选「真实账户仍以快照为权益、只模拟账户用账本」放弃：对比失焦
  quote: |-
