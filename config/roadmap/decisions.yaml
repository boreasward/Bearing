- decision_no: 102
  version: 1
  decided_on: '2026-10-31'
  question: 数据层：Agent 执行拉取、「拉取什么」做成 tool
  decision: |-
    **「拉取什么」做成注册表与 tool 的方向采纳；例行拉取不由 Agent 执行**。每个数据族写成适配器（名字、schema、拉取、落库与证据、主备源与降级）挂进注册表；定时批由宿主按注册表声明式地跑，不经过模型；同一个适配器自动暴露为 Agent 的 tool，供研究时在预算内登记补查（本轮不可见，宿主补采后开新一轮、记新截止时间，#110）。加备源或指标 = 加一个文件并注册，新增数据族另需表与迁移；批处理与 Agent 同时获得。理由：例行采集没有判断成分，纳指 100 成分加 ETF、六个数据族、每天几百次外部请求，让模型在循环里逐个调 tool 只多出 token、时长与「漏了一只」「宣称拉完了其实没拉」的新故障；Anthropic 给的数字是多 Agent 约 15 倍 token，而模型额度是 ChatGPT 订阅、`agent` 节点预算 25 分钟；截止时间与每族一行 `data_fetch_runs` 的保证靠宿主代码成立，交给模型只能靠 prompt 约束、没法测试。用户的「加 tool + 改 prompt」改为「加一个注册项」：多一步注册，少「模型会不会用对」的不确定性。原 v2.12 多数据源与降级并入为同一件事
  quote: |-
    agent 来完成拉取操作，然后“拉取什么”改造成 tool 方式；后续增加指标或者数据就能“加 tool + 改 prompt”方式
  version_ids: [v2.12]
