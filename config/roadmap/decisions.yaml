- decision_no: 93
  version: 1
  decided_on: '2026-10-31'
  question: Agent 自管账户的自由度与范围
  decision: |-
    买入必须指向当天允许的 `plan_id`（Agent 计划链头的入场期版本），止损 / T1 / 入场区间 / 入场类型用那一版的、不得另定；可决定买哪几份、买多少股（≤ 宿主算出的上限）、撤掉自己未成交的挂单、提前卖出持仓（全部或一半，次日开盘）；不能取消宿主的止损 / 时间止损 / T1 卖半，价位不对的出口是在链上出修订版。每天每账户一次单阶段模型调用（`agent-portfolio-1`），证据块给全部数字、工具与标的受限，输出 JSON 由宿主逐条校验：不合规的订单拒绝并记录原因、不替它改数，次日作为证据给它看；模型不可用当天不动（在挂单照旧结算）并记 `skipped`。理由：模拟成交与真实成交一样挂 `plan_id`，整套链与影子机器复用；「计划」与「挑选 / 仓位 / 卖点」分层归因；判定始终在宿主。备选「允许 Agent 死扛止损」放弃：等于把纪律让给模型；备选「提议 + 反方两阶段」放弃：每天一次组合决策不值一次反方调用，留 backlog
  quote: |-
