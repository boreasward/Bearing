    D13 / D14 / D46：候选备源为 Stooq 日线、Nasdaq 财报日；只补最近 10 个交易日内主源无任何 revision 的缺口，沿用主源最近复权比例。Task 0 spike 已证明 Stooq 不可用，日线备源留空；Nasdaq 可用，不能把候选 Stooq 写成已启用。
    来源：docs/roadmap/roadmap.md §3.2、§4.10；合并 spec D13、D14、D46、§25；docs/roadmap/v2.12-v2.15-acceptance.md §0。
  depends_on: [v2.8, v2.11]
  status: planned
  exit_conditions: |-
    加备源与标准指标各演练一次，一个文件加注册即可同时服务定时批与 tool；定时 10 个交易日有备源的族单源失败可切换且目标明细记 source_used，来源与降级可读；推导重算一致，模拟账户输入不因指标包装改变；用户能解释数据族来源与降级。Stooq 无可用数据，不视为日线备源通过；四版合并验收以冻结 spec 为准。
