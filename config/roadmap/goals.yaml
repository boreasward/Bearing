# source: docs/roadmap/roadmap.md §1、§4.1；monthly-5 补充来自 §4.9、#98。
# 人工整理；body 内区分原目标、原指标口径与后续已发布口径。
- goal_id: trading-growth
  version: 1
  body: |-
    ## 最终目标与角色

    最终目标（用户 2026-10-27）：Agent 生成交易计划，你复查并实施；Agent 的计划能沿时间链路反思、吸收后来的信号出新版；系统把它做了什么、为什么讲给你听；你的交易能力随系统一起进化。

    用户原话（roadmap §4.1）：
    - 核心目标：agent 生成交易计划，我来复查并实施计划；agent 交易计划可基于时间链路反思 + 补充信号。
    - 问题：我不能了解系统运行原理；我的预期是我的交易能力能够跟随系统进化。

    你的角色：阅读 Agent 的计划与理由，决定是否下单、何时止盈止损，自己下单并录入成交，审定复盘得出的经验。
    Agent 的角色：从规则候选出发给出可复查的计划，每日复查并修订，计划结束后起草复盘；v2.13 起链内多一段公司研究并接受你指定标的的研究，v2.14 起在计划之上做组合检查，v2.15 起从证据长出 roadmap 提案。
    程序的角色：数据、计算、校验、风险限制、记录；判定始终在宿主代码，不交给模型。

    ## 主指标：月度账户收益率

    | 档位 | 月度收益率 |
    |---|---|
    | 非常优秀 | > 20% |
    | 优秀 | 10% – 20% |
    | 可行 | 0% – 10% |
    | 需关注 | < 0% |

    原口径：（本月末资金快照 − 上月末资金快照 − 区间净出入金）÷ 上月末资金快照；同一行显示同月 SPY。
    v2.11 已发布口径 monthly-5（roadmap #98）：真实账户的月度收益率改为 (月末账本权益 − 上月末账本权益 − 区间净出入金) ÷ 上月末账本权益，两端取每日权益日志该月最后一个交易日的最新行；未开账或任一端缺行时回退快照口径（monthly-4 的公式，标 source = snapshot）；主指标仍只认真实账户，旧快照不重算。

    流程复查触发：滚动 3 个月复合收益 < 0 且跑输 SPY。
    优先级：收益 > 纪律 > 认知 > 省时间。一年约几十笔交易，第一年做到「收益口径算得准、算得诚实」，不以「已证明跑赢」为验收。

    ## 主线与成功标准

    扫描 screen-1 → 规则候选 → Agent 计划（默认复查对象）+ 规则基线（plan-1，v2.9 起 plan-2）→ 你复查、自己下单并录入成交（v2.9 起采纳由成交推导）→ 每日复查与版本更新（一只股票一条活跃链）→ 计划结束后复盘卡讲给你听 → 你审定的经验进「我的知识」→ 被后续 Agent 引用、被影子结果检验。

    1. v2.5：每个买入单元，只读 Agent 计划就能决定做不做；有论点、证据、反证、失效条件、价位依据、下次复查条件。有效计划每交易日有复查，修订差异可读、版本可回放、截止时间固定。
    2. v2.6：不读仓库文档，在系统里看懂今天跑了什么、概念含义、计划字段与数字的来源。
    3. v2.7：结束交易有复盘卡，教训经你审定进知识，被引用后能回看表现。
    4. v2.8：每日运行是一条可见、可续跑的链，逐目标拉取与失败可查；Agent 用 ChatGPT 订阅，截止时间与工具记录保证不变。
    5. v2.9：一只股票一条活跃链；计划表回答开盘三种情形与失效条件；持仓每日有状态，最长持有未到 1R 给退出指令；成交推导采纳，标的页可读计划历史。
    6. v2.10：全站遵循设计标准；数字有口径、样本量或时点，数据块五态可分，深浅色与手机三条只读路径成立。
    7. v2.11：真实与模拟账户同一账本口径；Agent 自管与机械照计划账户作对照；三账户曲线与指标并排，区分计划、挑选与仓位的差异。
    8. v2.12：备源有记录、差异可见；加备源或标准指标等于加注册项；新增数据族另需表与迁移，覆盖、菜单与 tool 从注册项生成，不改图与 prompt 正文。
    9. v2.13：链内有带引用、过校验的基本面与披露研究；指定标的或问题无需等待买入信号即可得到研究档案。
    10. v2.14：「今日」计划表之上有组合检查；持仓、现金、风险、行业集中、先后与互斥由宿主计算硬结果，Agent 写取舍，真实与模拟账户同一套检查。
    11. v2.15：roadmap 目标、版本、决策、证据只追加带版本；从证据提出路线与实施 brief，由你批准，仓库内走 spec / plan / 测试 / 发布，完成后回填版本与证据，随时可导出路线。

    Agent 成为默认复查对象不等于 Agent 有效；Phase 0 Gate HOLD 不解除，不自动晋升。没有记录的用户确认不算通过，工程完成不代替使用验收。
